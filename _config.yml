# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: brush's blog
subtitle:
description: "brush 的个人博客，记录 CTF 和学习过程"
keywords: "brush,博客,CTF,网络安全,学习记录"
author: brush
language: zh-CN
timezone: ""

# abbrlink config
abbrlink:
  alg: crc32 #support crc16(default) and crc32
  rep: hex #support dec(default) and hex

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
# TODO(brush)：域名还没定，先留占位。定下来后改这一行（会影响 sitemap / og:url / 友链回填地址），
#              并同步改下面 baidu_url_submit.host 与 source/social/link/index.md 的「本站信息」。
url: https://example.com/
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
# 指定不渲染某些页面
skip_render:
  - 'js/tag-map/*' # leaflet / proj4 第三方库原文件，原样复制，不做 Nunjucks 渲染
  - 'js/ai-chat.js' # AI 助手前端本体（含大段 CSS/JS 字面量），原样复制，不做 Nunjucks 渲染
  - 'box/astronomy/voyager.html' # 旅行者号交互星图，是完整独立页面（自带样式与脚本），由 index.md 用 iframe 引入，原样复制

# Writing
new_post_name: :year-:month-:day-:title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: true
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ""

math:
  engine: "mathjax"
  mathjax:
    src: custom_mathjax_source
    config:
      # MathJax config

# 音乐插件
aplayer:
  meting: true
  asset_inject: false

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 9
  order_by: -date

# Archive page setting
## 归档页 /archives/ 的每页篇数（与首页 index_generator.per_page 互不影响；缺省时 Hexo 默认 10）
## 卡片为 3 列布局，12 篇 = 4 行整、无残缺行
archive_generator:
  per_page: 12
  yearly: true
  monthly: true
  daily: false
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: "mtime"

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fomalhaut

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  - type: git
    # TODO(brush)：换成自己的仓库。用 GitHub Pages 用户站一般是 https://github.com/<用户名>/<用户名>.github.io.git
    repository: https://github.com/fszz996/my-blog.git
    branch: main
  # 百度主动推送：配好下面 baidu_url_submit 的 host / token 后再打开这一行，否则每次部署都会报错
  # - type: baidu_url_submitter
  # - type: git
  #   #repo改为repo: git@域名:/var/repo/hexo.git
  #   repo: git@127.0.0.1:/var/repo/hexo.git
  #   branch: main

# hexo-algolia(匹配标题)
# algolia:
#   applicationID: YOUR_ALGOLIA_APP_ID
#   apiKey: YOUR_ALGOLIA_SEARCH_KEY
#   indexName: your_index_name

# hexo-algoliasearch(可以匹配内容)
# 2026-11-23 停用：站点搜索已改为本地搜索（hexo-generator-search），不需要 Algolia 账号与密钥。
# 下面整段与文件末尾 plugins 里的 hexo-algoliasearch 一起注释掉了；
# 想换回 Algolia：取消两处注释、填好三个 Key，再把 _config.fomalhaut.yml 的 algolia_search.enable 改 true。
# algolia:
#   appId: "YOUR_ALGOLIA_APP_ID"
#   apiKey: "YOUR_ALGOLIA_SEARCH_KEY"
#   adminApiKey: "YOUR_ALGOLIA_ADMIN_KEY"
#   chunkSize: 5000
#   indexName: "your_index_name"
#   fields:
#     - content:strip:truncate,0,30000
#     - excerpt:strip
#     - gallery
#     - permalink
#     - photos
#     - slug
#     - tags
#     - title

# 首页轮播图
# hexo-butterfly-swiper
# see https://akilar.top/posts/8e1264d1/
swiper:
  enable: false # 开关（需要自建 gitcalendar 数据仓库，见 README「GitHub 贡献日历」）
  priority: 1 #过滤器优先权
  enable_page: / # 应用页面
  timemode: date #date/updated
  layout: # 挂载容器类型
    type: id
    name: recent-posts
    index: 0
  default_descr: 再怎么看我也不知道怎么描述它的啦！
  swiper_css: https://npm.elemecdn.com/hexo-butterfly-swiper/lib/swiper.min.css #swiper css依赖
  swiper_js: https://npm.elemecdn.com/hexo-butterfly-swiper/lib/swiper.min.js #swiper js依赖
  custom_css: https://npm.elemecdn.com/hexo-butterfly-swiper/lib/swiperstyle.css # 适配主题样式补丁
  custom_js: https://npm.elemecdn.com/hexo-butterfly-swiper/lib/swiper_init.js # swiper初始化方法

# 本地搜索
search:
  path: search.xml
  field: post
  content: true

# Extensions
## Plugins: http://hexo.io/plugins/
#RSS订阅
plugin:
  - hexo-generator-feed
#Feed Atom
feed:
type: atom
path: atom.xml
limit: 20

# 站点地图
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

# 主动推送百度，被百度收录
baidu_url_submit:
  count: 10 # 提交最新的10个链接
  host: https://example.com # TODO(brush)：换成百度站长平台里注册的域名
  token: YOUR_BAIDU_TOKEN # TODO(brush)：百度站长平台 > 推送接口 > 接口调用地址里的 token
  path: baidu_urls.txt # 文本文档的地址， 新链接会保存在此文本文档里，不用改

nofollow:
  enable: false
  field: site
  exclude: ""

# github提交日志
# hexo-filter-gitcalendar
# see https://akilar.top/posts/1f9c68c9/
gitcalendar:
  enable: false # 开关（2026-11-22 暂关：apiurl 还是占位地址，配好数据源后再开）
  priority: 5 #过滤器优先权
  enable_page: /site/census/ # 应用页面
  # butterfly挂载容器
  layout: # 挂载容器类型
    type: id
    name: gitZone
    index: 0
  # volantis挂载容器
  # layout:
  #   type: class
  #   name: l_main
  #   index: 0
  # matery挂载容器
  # layout:
  #   type: id
  #   name: indexCard
  #   index: 0
  # mengd挂载容器
  # layout:
  #   type: class
  #   name: content
  #   index: 0
  # simplemode: true
  user: yourname # git用户名
  apiurl: "https://gitcalendar.example.com" # 你的 gitcalendar 服务地址
  jsonurl: "https://cdn.jsdelivr.net/gh/yourname/gitcalendar-data@main/data.json" # 方案B：GitHub Action 定时更新的数据
  minheight:
    pc: 320px #桌面端最小高度
    mibile: 0px #移动端最小高度
  # 这里只作兜底：前端 gitcalendar.js 里的 git_theme_palette() 会读 --theme-color 实时生成
  # 一套同色系调色板（[0] 空白天用中性灰，[1]~[9] 主题色由浅到深）；
  # 只有读不到 --theme-color 时才会用到下面这套写死的颜色。
  color: "['#d9e0df', '#c6e0dc', '#a8dcd4', '#9adcd2', '#89ded1', '#77e0d0', '#5fdecb', '#47dcc6', '#39dcc3', '#1fdabe', '#00dab9']"
  # "['rgb(145, 145, 145, 0.2)', '#c6ecc1', '#a0e2bb', '#1fc7b6', '#70c5d3', '#60a2ce', '#507ac9', '#4356c5', '#423cc4', '#5b3abc', '#7138b6']" # 冷色系温度色调
  # "['rgb(145, 145, 145, 0.2)', '#c6ecc1', '#a0e2bb', '#1fc7b6', '#70c5d3', '#60a2ce', '#507ac9', '#4356c5', '#423cc4', '#5b3abc', '#7138b6']" # 冷色系温度色调
  # "['#ebedf0', '#cdefec', '#a9e4de', '#1fc7b6', '#65cfc5', '#4dc8bb', '#39bbae', '#319d93', '#278178', '#216962', '#1b5852']" #蒂芙尼蓝色调
  # "['#e4dfd7', '#f9f4dc', '#f7e8aa', '#f7e8aa', '#f8df72', '#fcd217', '#fcc515', '#f28e16', '#fb8b05', '#d85916', '#f43e06']" #橘黄色调
  # color: "['#ebedf0', '#fdcdec', '#fc9bd9', '#fa6ac5', '#f838b2', '#f5089f', '#c4067e', '#92055e', '#540336', '#48022f', '#30021f']" #浅紫色调
  # color: "['#ebedf0', '#f0fff4', '#dcffe4', '#bef5cb', '#85e89d', '#34d058', '#28a745', '#22863a', '#176f2c', '#165c26', '#144620']" #翠绿色调
  # color: "['#ebedf0', '#f1f8ff', '#dbedff', '#c8e1ff', '#79b8ff', '#2188ff', '#0366d6', '#005cc5', '#044289', '#032f62', '#05264c']" #天青色调
  container: .recent-post-item(style='width:100%;height:auto;padding:10px;') #父元素容器，需要使用pug语法
  gitcalendar_css: /css/gitcalendar.css #自托管，勿改回 CDN（2026-10-01）
  gitcalendar_js: /js/gitcalendar.js #自托管 + 已打「失败也摘转圈」补丁

# 新版的搜索插件
# 2026-11-23 停用 Algolia（见上方 algolia 段的说明，站点改用本地搜索）
# plugins:
#   - hexo-algoliasearch

# 小冰分类磁贴
# 2026-11-23：分类换成本站自己的四个方向；name 必须和文章 front-matter 里的 categories 完全一致，
# 否则磁贴会退化成跳 /categories/ 的总览页。
magnet:
  enable: true
  priority: 2
  enable_page: /
  type: categories
  devide: 2
  display:
    - name: 折腾记录
      display_name: 建站与工具折腾
      icon: 🛠️
    - name: 生活随记
      display_name: 生活碎碎念
      icon: 🍭
    # 下面两个方向暂时还没有文章，先注释掉：Hexo 只给「已用过的分类」生成页面，
    # 磁贴指向不存在的分类会退化成跳 /categories/ 总览。等写了第一篇再取消注释。
    # - name: CTF
    #   display_name: CTF 题解与复现
    #   icon: 🚩
    # - name: 学习笔记
    #   display_name: 计算机基础与学习笔记
    #   icon: 📚
  color_setting:
    text_color: black # 文字默认颜色
    text_hover_color: white # 文字鼠标悬浮颜色
    background_color: "#e9e9e9" # 文字背景默认颜色
    background_hover_color: var(--text-bg-hover) # 文字背景悬浮颜色
  layout:
    type: id
    name: recent-posts
    index: 0
  temple_html: '<div class="recent-post-item" style="width:100%;height: auto"><div id="catalog_magnet">${temple_html_item}</div></div>'
  plus_style: ""

# 目录一级标题跳转
markdown:
  anchors:
    level: 1
