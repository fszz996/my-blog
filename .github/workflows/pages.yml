name: Deploy to GitHub Pages

# 2026-11-23：GitHub Pages 项目站（https://fszz996.github.io/my-blog/）
# push 到 main 即自动构建并发布；也可以在 Actions 页面点「Run workflow」手动跑。
# 换到自有域名后，把下面「子路径修正」那一步删掉即可（根路径不需要补前缀）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ① lock 里 1300+ 个包的下载地址是国内的 registry.npmmirror.com（本地装依赖时留下的），
      #    境外 runner 从它拉包会大面积超时 → 先换回官方 registry（只换主机名，版本与 integrity 不动）
      # ② 用 install 而不是 ci：这个 lock 是 2022 年用老版 npm 生成的（lockfileVersion 2），
      #    npm 10 的 `ci` 会因「锁文件缺 chokidar@3 等条目」直接 EUSAGE 拒绝安装，
      #    而 `install` 会在锁文件基础上补齐缺项。改回 ci 之前先跑一次 `npm install` 提交新锁文件。
      # ③ --ignore-scripts：依赖里 ttf2woff2 是原生模块，装的时候要编译/下二进制，runner 上常失败；
      #    它只被 gulp 的字体子集化用到，`hexo generate` 这条链全是纯 JS，不需要原生模块
      - name: 安装依赖
        run: |
          node tools/normalize-lock-registry.cjs
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --fetch-retries=5 --fetch-timeout=120000

      - name: 构建站点
        run: npx hexo clean && npx hexo generate

      # 站里有一批写死的 /assets、/css、/js 引用（inject 注入、内联样式、manifest 等），
      # 在 /my-blog/ 子路径下会 404，这一步统一补前缀（脚本幂等，可重复跑）
      - name: 修正子路径引用
        run: node tools/fix-subpath.cjs --prefix /my-blog

      - name: 准备 Pages
        uses: actions/configure-pages@v5
        # 注意：仓库必须先启用 Pages，否则这一步会报
        #   "Get Pages site failed. Error: Not Found" 或 "Create Pages site failed"。
        # 启用方式（只需一次，网页上点两下）：
        #   仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」→ 保存
        # 不能用 enablement: true 自动开：GITHUB_TOKEN 没有创建 Pages 站点的权限
        # （实测报 Resource not accessible by integration）。

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4