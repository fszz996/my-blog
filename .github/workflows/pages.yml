name: Deploy to GitHub Pages

# 2026-11-23：GitHub Pages 项目站（https://fszz996.github.io/my-blog/）
# push 到 main 即自动构建并发布；也可以在 Actions 页面点「Run workflow」手动跑。
# 换到自有域名后，把下面「子路径修正」那一步删掉即可（根路径不需要补前缀）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ① lock 里 1300+ 个包的下载地址是国内的 registry.npmmirror.com（本地装依赖时留下的），
      #    境外 runner 从它拉包会大面积超时 → 先换回官方 registry（只换主机名，版本与 integrity 不动）
      # ② --ignore-scripts：依赖里 ttf2woff2 是原生模块，装的时候要编译/下二进制，runner 上常失败；
      #    它只被 gulp 的字体子集化用到，`hexo generate` 这条链全是纯 JS，不需要原生模块
      - name: 安装依赖
        run: |
          node tools/normalize-lock-registry.cjs
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --fetch-retries=5 --fetch-timeout=120000

      - name: 构建站点
        run: npx hexo clean && npx hexo generate

      # 站里有一批写死的 /assets、/css、/js 引用（inject 注入、内联样式、manifest 等），
      # 在 /my-blog/ 子路径下会 404，这一步统一补前缀（脚本幂等，可重复跑）
      - name: 修正子路径引用
        run: node tools/fix-subpath.cjs --prefix /my-blog

      - name: 准备 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开启 Pages 时尝试自动开启（需要在 Settings → Pages 里
          # 把 Source 选成 GitHub Actions；只开一次，之后一直有效）
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4