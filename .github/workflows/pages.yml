name: Deploy to GitHub Pages

# 2026-11-23：GitHub Pages 项目站（https://fszz996.github.io/my-blog/）
# push 到 main 即自动构建并发布；也可以在 Actions 页面点「Run workflow」手动跑。
# 换到自有域名后，把下面「子路径修正」那一步删掉即可（根路径不需要补前缀）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 说明：--ignore-scripts 是必须的。
      # 依赖里 ttf2woff2 是原生模块，安装时会跑 install 脚本去编译/下载二进制，
      # 在 GitHub 的 Ubuntu runner 上经常失败；而它只被 gulp 的字体子集化任务用到，
      # `hexo generate` 这条链（hexo + 渲染器 + 插件）全是纯 JS，不需要任何原生模块。
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 构建站点
        run: npx hexo clean && npx hexo generate

      # 站里有一批写死的 /assets、/css、/js 引用（inject 注入、内联样式、manifest 等），
      # 在 /my-blog/ 子路径下会 404，这一步统一补前缀（脚本幂等，可重复跑）
      - name: 修正子路径引用
        run: node tools/fix-subpath.cjs --prefix /my-blog

      - name: 准备 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没开启 Pages 时尝试自动开启（需要在 Settings → Pages 里
          # 把 Source 选成 GitHub Actions；只开一次，之后一直有效）
          enablement: true

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4